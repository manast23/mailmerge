<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Compose - Mail Merge Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
        .ghost-border { border: 1px solid #e8e9ec; }
        .ambient-shadow { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .editor-container:focus-within { border-color: #111112; outline: none; box-shadow: 0 0 0 2px rgba(17, 17, 18, 0.05); }
        .placeholder-tag { background: #f2f3f5; color: #111112; border-radius: 4px; padding: 0 4px; font-family: monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e1e2e4; border-radius: 10px; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; }
    </style>
</head>
<body class="bg-[#f8f9fb] text-[#111112] overflow-hidden">
<div class="flex h-screen w-full">
<aside class="fixed left-0 top-0 h-full w-[220px] border-r border-[#e8e9ec] bg-white flex flex-col py-8 px-2 z-50">
<div class="mb-10 px-4"><span class="text-xl font-bold text-[#111112] block">Mail Merge Pro</span></div>
<nav class="flex-1 space-y-1">
<a class="flex items-center gap-2 text-[#5c5f60] hover:text-[#111112] hover:bg-[#f2f4f6] transition-colors py-2 px-4 rounded-lg text-sm" href="#"><span class="material-symbols-outlined">home</span><span>Home</span></a>
<a class="flex items-center gap-2 text-[#5c5f60] hover:text-[#111112] hover:bg-[#f2f4f6] transition-colors py-2 px-4 rounded-lg text-sm" href="#"><span class="material-symbols-outlined">send</span><span>Campaigns</span></a>
<a class="flex items-center gap-2 bg-[#edeef0] border-l-2 border-[#111112] text-[#111112] font-semibold py-2 px-4 rounded-r-lg text-sm" href="#"><span class="material-symbols-outlined">edit_note</span><span>Compose</span></a>
<a class="flex items-center gap-2 text-[#5c5f60] hover:text-[#111112] hover:bg-[#f2f4f6] transition-colors py-2 px-4 rounded-lg text-sm" href="#"><span class="material-symbols-outlined">query_stats</span><span>Dashboard</span></a>
<a class="flex items-center gap-2 text-[#5c5f60] hover:text-[#111112] hover:bg-[#f2f4f6] transition-colors py-2 px-4 rounded-lg text-sm" href="#"><span class="material-symbols-outlined">person</span><span>Account</span></a>
</nav>
</aside>
<main class="ml-[220px] flex-1 flex flex-col min-w-0 bg-[#f8f9fb]">
<!-- Top bar: no notification/help icons, no stock photo -> initials avatar -->
<header class="flex justify-between items-center w-full h-16 px-8 border-b border-[#e8e9ec] bg-[#f8f9fb] shrink-0">
<h1 class="text-xl font-bold text-[#111112]">Compose</h1>
<div class="flex items-center gap-3">
<div class="flex items-center gap-2 px-3 py-1 bg-[#f2f4f6] rounded-full"><div class="w-2 h-2 rounded-full bg-[#c5c6c8] animate-pulse"></div><span class="text-xs text-[#5c5f60] italic">auto-saving...</span></div>
<div class="h-8 w-8 rounded-full bg-[#111112] flex items-center justify-center text-white font-semibold text-sm">A</div>
</div>
</header>
<div class="flex-1 flex overflow-hidden">
<nav class="w-[240px] shrink-0 border-r border-[#e8e9ec] bg-white flex flex-col p-4">
<button class="w-full mb-6 py-2 px-4 bg-[#111112] text-white rounded-lg text-sm hover:opacity-90 transition-all flex items-center justify-center gap-2"><span class="material-symbols-outlined text-base">add</span>New Template</button>
<div class="text-xs text-[#5c5f60] uppercase tracking-widest px-2 mb-3">Saved Templates</div>
<div class="space-y-1 overflow-y-auto">
<button class="w-full text-left px-3 py-3 rounded-lg bg-[#f2f4f6] border border-[#e8e9ec] text-[#111112] font-semibold flex flex-col"><span class="text-sm truncate">Summer Outreach</span></button>
<button class="w-full text-left px-3 py-3 rounded-lg hover:bg-[#f7f8fa] border border-transparent transition-all flex flex-col"><span class="text-sm truncate">Follow-up Q3</span></button>
<button class="w-full text-left px-3 py-3 rounded-lg hover:bg-[#f7f8fa] border border-transparent transition-all flex flex-col"><span class="text-sm truncate">Event Invitation</span></button>
</div>
</nav>
<div class="flex-1 overflow-y-auto p-8 max-w-5xl mx-auto w-full">
<div class="space-y-4">
<div class="space-y-4">
<div class="grid grid-cols-[120px_1fr] items-center gap-4"><label class="text-sm text-[#5c5f60] font-medium">Template Name</label><input class="w-full bg-white border border-[#e8e9ec] rounded-lg px-4 py-2 text-sm focus:border-[#111112] focus:ring-0 transition-all outline-none" type="text" value="Summer Outreach"/></div>
<div class="grid grid-cols-[120px_1fr] items-center gap-4"><label class="text-sm text-[#5c5f60] font-medium">Subject</label><input class="w-full bg-white border border-[#e8e9ec] rounded-lg px-4 py-2 text-sm focus:border-[#111112] focus:ring-0 transition-all outline-none" type="text" value="Exciting updates for {{first_name}}!"/></div>
</div>
<div class="bg-white border border-[#e8e9ec] rounded-xl overflow-hidden ambient-shadow editor-container transition-all flex flex-col min-h-[500px]">
<div class="border-b border-[#e8e9ec] bg-[#f2f4f6] px-4 py-2 flex items-center justify-between">
<div class="flex items-center gap-1">
<button class="p-2 hover:bg-[#e7e8ea] rounded transition-colors" title="Bold"><span class="material-symbols-outlined text-base">format_bold</span></button>
<button class="p-2 hover:bg-[#e7e8ea] rounded transition-colors" title="Italic"><span class="material-symbols-outlined text-base">format_italic</span></button>
<button class="p-2 hover:bg-[#e7e8ea] rounded transition-colors" title="Strikethrough"><span class="material-symbols-outlined text-base">format_strikethrough</span></button>
</div>
<div class="flex items-center gap-2">
<span class="text-xs text-[#5c5f60]">Insert Placeholder:</span>
<select class="text-xs bg-transparent border border-[#e8e9ec] rounded px-2 py-1 outline-none"><option>{{first_name}}</option><option>{{last_name}}</option><option>{{university}}</option></select>
</div>
</div>
<div class="p-8 flex-1 outline-none text-base leading-relaxed text-[#111112]" contenteditable="true">
<p>Dear <span class="placeholder-tag">{{first_name}}</span>,</p><br/>
<p>I hope this email finds you well...</p>
</div>
</div>
<div class="border-2 border-dashed border-[#e8e9ec] rounded-xl p-8 flex flex-col items-center justify-center bg-white hover:bg-[#f2f4f6] hover:border-[#111112] transition-all cursor-pointer group">
<div class="w-12 h-12 bg-[#edeef0] rounded-full flex items-center justify-center mb-4 group-hover:bg-[#111112]/5 transition-all"><span class="material-symbols-outlined text-[#5c5f60] group-hover:text-[#111112]">upload_file</span></div>
<span class="text-sm font-semibold text-[#111112]">Click to upload attachments</span>
<span class="text-xs text-[#5c5f60] mt-1">PDF, Word, Excel, or image files</span>
</div>
</div>
</div>
</div>
</main>
</div>
<!-- FIXES APPLIED: removed notification/help icons + stock photo -> initials avatar;
     removed "Discard" and "Send Test Email" buttons (app has no test-send feature,
     saving is fully automatic); updated attachment helper text to match real supported
     types (PDF, Word, Excel, images) instead of PDF/JPG/PNG only -->
</body></html>
