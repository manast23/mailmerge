<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Mail Merge Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .input-focus-glow:focus { outline: none; border-color: #111112; box-shadow: 0 0 0 2px rgba(17, 17, 18, 0.05); }
        .dot-grid { background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0); background-size: 24px 24px; }
    </style>
</head>
<body class="bg-[#f7f8fa] text-[#111112] min-h-screen">
<main class="flex min-h-screen">
<div class="hidden lg:flex flex-col w-[55%] bg-[#111112] relative overflow-hidden p-12">
<div class="absolute inset-0 dot-grid opacity-20 pointer-events-none"></div>
<div class="relative z-10"><h1 class="text-2xl font-semibold text-white tracking-tighter opacity-90">Mail Merge Pro</h1></div>
<div class="flex-1 flex items-center relative z-10">
<p class="text-white font-light text-5xl tracking-tight leading-tight">Outreach, refined.</p>
</div>
</div>
<div class="w-full lg:w-[45%] bg-[#f7f8fa] flex flex-col items-center justify-center p-12 lg:p-16">
<div class="w-full max-w-[380px] space-y-8" id="loginCard">
<div class="lg:hidden mb-10 flex flex-col items-center"><h1 class="text-2xl font-semibold text-[#111112]">Mail Merge Pro</h1></div>
<div><h2 class="text-xl font-semibold text-[#111112]">Welcome back</h2><p class="text-sm text-[#5c5f60] mt-1">Log in to manage your campaigns.</p></div>
<form action="#" class="space-y-4" id="loginForm" method="POST">
<div class="space-y-2">
<label class="text-sm font-medium text-[#111112]" for="email">Email Address</label>
<input class="w-full px-4 py-3 bg-white border border-[#e8e9ec] rounded-lg text-sm placeholder:text-[#77777b]/50 input-focus-glow transition-all duration-200" id="email" name="email" placeholder="name@company.com" required type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-[#111112]" for="password">Password</label>
<a class="text-xs text-[#5c5f60] hover:text-[#111112] transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 bg-white border border-[#e8e9ec] rounded-lg text-sm placeholder:text-[#77777b]/50 input-focus-glow transition-all duration-200" id="password" name="password" placeholder="••••••••" required type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-[#5c5f60] hover:text-[#111112] transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full py-3 bg-[#111112] text-white text-sm font-medium rounded-lg hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-4" type="submit">Log in</button>
</form>
<div class="pt-2">
<div class="border-t border-[#e8e9ec] w-full mb-6"></div>
<div class="text-center"><p class="text-sm text-[#5c5f60]">Don't have an account? <a class="text-[#111112] font-semibold hover:underline decoration-1 underline-offset-4" href="#">Sign up</a></p></div>
</div>
</div>
</div>
</main>
</body></html>
